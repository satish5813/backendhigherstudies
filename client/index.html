<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the layout reaches under the notch and the home
         indicator on phones, which is where most students open this. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b01c25" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="KL Placement Readiness — the Koneru Lakshmaiah Education Foundation placement platform. Build an ATS-scored resume, publish a recruiter-ready profile, and track every application in one place."
    />
    <title>KL Placement Readiness — KL University</title>

    <!-- The seal doubles as the favicon once it is dropped into public/brand/.
         The SVG is tried first; browsers fall back to the PNG on their own. -->
    <link rel="icon" type="image/svg+xml" href="/brand/kl-seal.svg" />
    <link rel="icon" type="image/png" href="/brand/kl-seal.png" />
    <link rel="apple-touch-icon" href="/brand/kl-seal.png" />

    <meta property="og:title" content="KL Placement Readiness" />
    <meta property="og:site_name" content="KL University" />
    <meta
      property="og:description"
      content="Build an ATS-scored resume, publish a recruiter-ready profile, and track every application."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/kl-lockup.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces for display, Inter for everything read at length.
         Fraunces is a variable serif with an optical-size axis, so a 60px
         headline gets the high-contrast, tight-fitting cut a display face
         should have while a 20px sub-head stays sturdy — one family doing the
         work of two. `SOFT` rounds the terminals slightly so it reads warm
         rather than severe next to an engraved university seal. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full bg-ink-50 antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
